name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand site.zip if present
        run: |
          if [ -f site.zip ]; then
            unzip -o -q site.zip
            rm site.zip
            git config user.name "Callout Web"
            git config user.email "calloutweb.hello@gmail.com"
            git add -A
            git commit -m "Expand site.zip"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
